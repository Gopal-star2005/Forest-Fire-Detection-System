<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1d26"/>
      <stop offset="50%" stop-color="#102f3f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>

    <!-- Fire Gradient -->
    <linearGradient id="fire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#d00000"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)" />

  <!-- Forest Trees -->
  <g fill="#1b5e20" opacity="0.85">
    <polygon points="100,260 130,190 160,260"/>
    <polygon points="150,260 190,170 230,260"/>
    <polygon points="210,260 250,200 290,260"/>
    <polygon points="270,260 310,180 350,260"/>
  </g>

  <!-- Fire -->
  <path d="M980 250 
           C950 210, 1020 170, 990 130 
           C1030 150, 1060 190, 1040 230 
           C1080 250, 1030 280, 980 250 Z"
        fill="url(#fire)" filter="url(#glow)"/>

  <!-- IoT Signal -->
  <g stroke="#90e0ef" stroke-width="3" fill="none">
    <circle cx="860" cy="140" r="14"/>
    <path d="M840 120 Q860 100 880 120"/>
    <path d="M830 105 Q860 75 890 105"/>
  </g>

  <!-- ML Nodes -->
  <g fill="#8ecae6">
    <circle cx="760" cy="130" r="5"/>
    <circle cx="780" cy="110" r="5"/>
    <circle cx="800" cy="130" r="5"/>
    <line x1="760" y1="130" x2="780" y2="110" stroke="#8ecae6"/>
    <line x1="780" y1="110" x2="800" y2="130" stroke="#8ecae6"/>
  </g>

  <!-- Title -->
  <text x="60" y="125" fill="#ffffff"
        font-size="36"
        font-family="Segoe UI, Arial, sans-serif"
        font-weight="700">
    IoT-Based Early Forest Fire Detection & Response System
  </text>

  <!-- Subtitle -->
  <text x="60" y="170" fill="#c7f9cc"
        font-size="18"
        font-family="Segoe UI, Arial, sans-serif">
    Intelligent fire prediction using IoT sensing and Machine Learning
  </text>

  <!-- Footer -->
  <text x="60" y="210" fill="#a8dadc"
        font-size="14"
        font-family="Segoe UI, Arial, sans-serif">
    Disaster Management • Embedded Systems • Machine Learning
  </text>
</svg>
